name: Scheduled security scan

on:
  schedule:
    - cron: '31 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - name: Verify source and fixture boundaries
        run: |
          python3 scripts/verify-source-boundary.py
          python3 scripts/generate-license-inventory.py --check
          python3 scripts/verify-provenance.py
          python3 scripts/verify-public-test-fixtures.py
          python3 scripts/generate-source-manifest.py --check

      - name: Resolve latest immutable release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern image-reference.txt --dir artifacts
          image_ref="$(cat artifacts/image-reference.txt)"
          [[ "$image_ref" =~ ^ghcr\.io/ratio1/r1-distributed-sql@sha256:[0-9a-f]{64}$ ]]
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
          printf 'image_ref=%s\n' "$image_ref" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac

      - name: Verify signature, attestations, and anonymous pull
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/verify-image.sh '${{ steps.release.outputs.image_ref }}' '${{ steps.release.outputs.tag }}'

      - name: Scan immutable published digest
        uses: aquasecurity/trivy-action@dc5a429b52fcf669ce959baa2c2dd26090d2a6c4
        with:
          image-ref: ${{ steps.release.outputs.image_ref }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Scan repository filesystem
        uses: aquasecurity/trivy-action@dc5a429b52fcf669ce959baa2c2dd26090d2a6c4
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          skip-dirs: engine/pkg/security/securitytest/test_certs
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'
