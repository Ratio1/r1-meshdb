name: Scheduled security scan

on:
  schedule:
    - cron: '31 3 * * 1'
  workflow_dispatch:

permissions:
  attestations: read
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned GitHub CLI
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gh_2.97.0_linux_amd64.tar.gz"
          curl --fail --location --silent --show-error \
            https://github.com/cli/cli/releases/download/v2.97.0/gh_2.97.0_linux_amd64.tar.gz \
            --output "$archive"
          printf '%s  %s\n' \
            a2c9b8497e1f85b1ad0dfcb78b5a622e098801b8e461e459e88e1ee12f018112 \
            "$archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          printf '%s\n' "$RUNNER_TEMP/gh_2.97.0_linux_amd64/bin" >> "$GITHUB_PATH"

      - name: Resolve latest immutable release revision
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"
          [[ "$tag" =~ ^v1\.0\.[0-9]+$ ]]
          git fetch --force origin "refs/tags/${tag}:refs/tags/${tag}"
          tag_commit="$(git rev-list -n 1 "$tag")"
          [[ "$tag_commit" =~ ^[0-9a-f]{40}$ ]]
          git checkout --detach "${tag_commit}"
          [[ "$(git rev-parse HEAD)" == "$tag_commit" ]]
          mkdir -p artifacts
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" \
            --pattern image-reference.txt --dir artifacts
          image_ref="$(cat artifacts/image-reference.txt)"
          [[ "$image_ref" =~ ^ghcr\.io/ratio1/r1-meshdb@sha256:[0-9a-f]{64}$ ]]
          {
            printf 'tag=%s\n' "$tag"
            printf 'tag_commit=%s\n' "$tag_commit"
            printf 'image_ref=%s\n' "$image_ref"
          } >> "$GITHUB_OUTPUT"

      - name: Verify release source and fixture boundaries
        run: |
          python3 scripts/verify-source-boundary.py
          python3 scripts/generate-license-inventory.py --check
          python3 scripts/verify-provenance.py
          python3 scripts/verify-public-test-fixtures.py
          python3 scripts/verify-security-vex.py
          python3 scripts/generate-source-manifest.py --check
          scripts/verify-upstream-provenance.sh

      - name: Install Cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac
        with:
          cosign-release: v3.1.3

      - name: Verify signature, attestations, and anonymous pull
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/verify-image.sh '${{ steps.release.outputs.image_ref }}' '${{ steps.release.outputs.tag }}'

      - name: Record raw immutable-image findings
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          version: v0.73.0
          image-ref: ${{ steps.release.outputs.image_ref }}
          format: json
          output: artifacts/trivy-raw.json
          severity: CRITICAL,HIGH
          exit-code: '0'

      - name: Scan immutable published digest through reviewed VEX
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        env:
          TRIVY_VEX: security/openvex.json
        with:
          version: v0.73.0
          image-ref: ${{ steps.release.outputs.image_ref }}
          format: json
          output: artifacts/trivy-vex.json
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Scan repository filesystem
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        env:
          TRIVY_VEX: security/openvex.json
        with:
          version: v0.73.0
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          skip-dirs: engine/pkg/security/securitytest/test_certs
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'

      - name: Upload scheduled security evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: r1-meshdb-security-${{ github.run_id }}
          path: |
            artifacts/trivy-raw.json
            artifacts/trivy-vex.json
            artifacts/image-reference.txt
          if-no-files-found: error
          retention-days: 90
